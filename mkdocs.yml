site_name: Alchemical Queues
repo_url: https://github.com/thijsmie/alchemical_queues
repo_name: thijsmie/alchemical_queues

nav:
  - Introduction:
    - "index.md"
    - "changelog.md"
  - Usage:
    - "usage/installation.md"
    - "usage/tutorial.md"
    - "usage/databases.md"
    - "usage/flask_example.md"
    - "usage/advanced.md"
  - Development:
    - "development/contributing.md"
    - "development/postgres.md"
  - API:
    - Core:
      - "api/core/AlchemicalQueues.md"
      - "api/core/AlchemicalQueue.md"
      - "api/core/AlchemicalEntry.md"
      - "api/core/AlchemicalResponse.md"
    - Tasks:
      - task: "api/tasks/task.md"
      - "api/tasks/Worker.md"
      - "api/tasks/Task.md"
      - "api/tasks/QueuedTask.md"
      - "api/tasks/TaskInfo.md"
      - "api/tasks/TaskException.md"

theme:
  name: material
  custom_dir: docs/theme
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
extra_css:
- stylesheets/extra.css
extra:
  version:
    provider: mike
plugins:
- macros:
    include_dir: .
- mike
- search
- mkdocstrings:
    default_handler: python
    handlers:
      python:
        paths: [src]
        inventories:
        - https://docs.python.org/3/objects.inv
        options:
          docstring_style: google
          docstring_options:
            ignore_init_summary: no
          separate_signature: no
          show_source: yes
          show_root_full_path: no
          members_order: source
          filters:
            - "!^_"
            - "^__init__$"
            - "^__getitem__$"
            - "!^can_replace$"
copyright: Copyright &copy; 2022 Thijs Miedema
