name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}

jobs:
  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/alchemical_queues/
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ env.RELEASE_TAG }}
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install
    - name: Build
      run: uv build
    - name: Publish to PyPI
      run: uv publish

  deploy-docs:
    runs-on: ubuntu-latest
    name: Deploy docs
    steps:
    - uses: actions/checkout@v3
      with:
        ref: ${{ env.RELEASE_TAG }}
        fetch-depth: 0
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"
    - name: Set up Python
      run: uv python install
    - name: Install dependencies
      run: uv sync --all-groups
    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    - name: Deploy docs with mike
      run: uv run mike deploy --push --update-aliases ${{ env.RELEASE_TAG }} latest
    - name: Set default docs version
      run: uv run mike set-default --push latest
