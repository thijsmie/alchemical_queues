[project]
name = "alchemical_queues"
version = "0.1.2"
description = "Task Queues on pure SQLAlchemy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2",
]
authors = [{ name = "Thijs Miedema", email = "mail@tmiedema.com"}]
license = "MIT"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.5",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-macros-plugin>=1.5.0",
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.12.0",
    "mike>=2.1.3",
]
meta = [
    "anybadge>=1.14.0",
    "coverage>=7.0.0",
]


[tool.poetry.scripts]
alchemical_worker = "alchemical_queues.tasks.cli:cli"

[tool.mypy]
python_version = "3.10"
plugins = "sqlalchemy.ext.mypy.plugin"
warn_unused_configs = true
exclude = ["meta/", "tests/"]

[[tool.mypy.overrides]]
module = "alchemical_queues.tasks"
warn_return_any = true
disallow_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "alchemical_queues"
warn_return_any = true
disallow_untyped_defs = true
warn_unreachable = true

[tool.pylint.'MESSAGES CONTROL']
disable = ["R0903", "C0301"]
