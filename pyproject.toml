[project]
name = "alchemical_queues"
version = "0.2.0"
description = "Task Queues on pure SQLAlchemy"
readme = "README.md"
license = "MIT"
authors = [{ name = "Thijs Miedema", email = "mail@tmiedema.com" }]
requires-python = ">=3.7"
dependencies = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "typing_extensions",
]

[project.optional-dependencies]
pydantic = ["pydantic>=2"]

[project.scripts]
alchemical_worker = "alchemical_queues.tasks.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/alchemical_queues"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=7",
    "pytest-asyncio>=0.23; python_version >= '3.9'",
    "pytest-cov>=4.0.0",
    "aiosqlite; python_version >= '3.9'",
    "mypy",
    "pydantic>=2",
    "anybadge",
    "mkdocs-macros-plugin>=0.7.0",
    "mkdocs>=1.4",
    "mkdocs-material>=8",
    "mike>=1",
    "mkdocstrings[python]>=0.19",
    {include-group = "examples"},
]
examples = [
    "flask>=3; python_version >= '3.9'",
    "fastapi>=0.100; python_version >= '3.9'",
    "starlette>=0.30; python_version >= '3.9'",
    "litestar>=2; python_version >= '3.9'",
    "httpx; python_version >= '3.9'",
    "uvicorn; python_version >= '3.9'",
    "aiosqlite; python_version >= '3.9'",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov-config=.coveragerc --cov-report=xml"
required_plugins = "pytest-cov"
testpaths = "tests"

[tool.mypy]
python_version = "3.7"
warn_unused_configs = true
exclude = ["meta/", "tests/"]

[[tool.mypy.overrides]]
module = "alchemical_queues.tasks"
warn_return_any = true
disallow_untyped_defs = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "alchemical_queues"
warn_return_any = true
disallow_untyped_defs = true
warn_unreachable = true

[tool.ruff]
target-version = "py37"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
